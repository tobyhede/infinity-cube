[package]
name = "infinity-cube-desktop"
version.workspace = true
description = "The InfinityCube desktop application: a Tauri shell over the Rust host"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-updater = "=2.14.1"
bytes = { workspace = true }
host = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# `tauri::generate_context!` writes the plugins' configuration as serde_json values.
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
url = { workspace = true }

[dev-dependencies]
http-conformance = { workspace = true }
serde_json = { workspace = true }
# Test setup only: a migrated SQLite file and a migrated PostgreSQL database for
# the scheme's tests over each repository. The shell migrates nothing (ADR 0181).
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "sqlite-bundled"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
