[package]
name = "infinity-cube-desktop"
version = "0.0.0"
description = "The InfinityCube desktop application: a Tauri shell over the desktop sidecar"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
