# The desktop application's update endpoint (rust-host issue 06). An
# installed build asks
# https://github.com/<repository>/releases/download/desktop-updates/latest.json
# for a newer one (`plugins.updater` in packages/desktop/src-tauri/tauri.conf.json).
# Publishing a preview release copies that release's `latest.json`, which
# release.yml attached to the draft, over the one the `desktop-updates`
# release holds, so a draft offers nothing until a person publishes it.
#
# `desktop-updates` is a pre-release holding only that file, never a build;
# release/install.sh skips it, installing only a release whose tag is a
# version.
name: Desktop updates

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-updates

jobs:
  publish:
    name: Offer the published release to installed builds
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Copy latest.json to the desktop-updates release
        run: |
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/latest.json"
          if ! gh release view desktop-updates >/dev/null 2>&1; then
            gh release create desktop-updates --prerelease \
              --title "Desktop update endpoint" \
              --notes "Holds the latest.json installed InfinityCube desktop builds read to find a newer preview build. It is not a build: install from a release whose tag is a version."
          fi
          gh release upload desktop-updates "$RUNNER_TEMP/latest.json" --clobber
