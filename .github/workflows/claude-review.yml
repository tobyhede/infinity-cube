# Asks Claude for a code review of a pull request through the shared workflow in
# cipherstash/workflows, pinned below by commit. It replaces this repository's
# own call to the code-review routine.
#
# Three kinds of request reach it, and the shared workflow decides each one:
# a non-draft pull request opened, reopened or marked ready for review; a
# comment whose first line starts `@cipherstash-agent review` (drafts too; the
# rest of the comment goes to the review as instructions, and the comment gets
# a 👀 once the request is sent); and a review requested from
# cipherstash-agent in the Reviewers box. Each requester must be an active
# member of the `team` input's team in the repository owner's organisation,
# except a pull request opened by cipherstash-agent itself. Drafts (for the
# first kind), bots and forks are skipped. A failed request shows as an error
# in the run and never turns the check red. The job is kept out of `ci.yml` so
# the `ci` gate does not depend on it.
#
# Comments run this file from the default branch, so the comment command works
# only once this file is merged there.
#
# Needs, as repository or organisation settings:
#   secret CLAUDE_ROUTINE_TOKEN           the code-review routine's bearer token
#   secret CLAUDE_REVIEW_APP_ID           the membership GitHub App's id
#   secret CLAUDE_REVIEW_APP_PRIVATE_KEY  the membership GitHub App's private key
#   variable CLAUDE_ROUTINE_TRIGGER_ID    the routine's trigger id (`trig_…`)
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  # zizmor flags issue_comment because anyone who can comment can start this
  # workflow. Accepted: the shared workflow acts only on a team member's comment
  # command, checked by its decide job, and never runs code from the pull request.
  issue_comment: # zizmor: ignore[dangerous-triggers] only a team member's comment command is acted on
    types: [created]

permissions: {}

jobs:
  review:
    # Saves runners for comments that cannot be a command and for review
    # requests for anyone else; the shared workflow still checks every rule. The
    # mention must match the shared workflow's `review-agent` input.
    if: >-
      (github.event_name != 'issue_comment' || (
      github.event.issue.pull_request
      && contains(github.event.comment.body, '@cipherstash-agent')
      ))
      && (github.event.action != 'review_requested' || github.event.requested_reviewer.login == 'cipherstash-agent')
    # The shared workflow's jobs hold no more than this; only its reaction job
    # uses it, to add 👀 to a comment command.
    permissions:
      issues: write
    uses: cipherstash/workflows/.github/workflows/claude-review.yml@386ac4e3cb2458933d3a377a6292478c2cbd2f9f # main, 2026-11-19
    with:
      routine-trigger-id: ${{ vars.CLAUDE_ROUTINE_TRIGGER_ID }}
    secrets:
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
      CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
      CLAUDE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
