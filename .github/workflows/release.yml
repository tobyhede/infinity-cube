# Preview builds of the `infinity-cube` CLI (ADR 0166): one binary per
# platform with the browser application embedded, packed with
# `release/README.md` and both licence files, and attached to a draft
# GitHub pre-release with `release/install.sh`, which installs one of them.
# Beside them, the desktop application for Apple silicon (rust-host issue
# 06): an ad-hoc signed disk image and, when the updater's key is a secret,
# the signed update bundle and the `latest.json` that offers it, which
# desktop-updates.yml serves once the release is published.
#
# - A tag `v<version>` pushed on a commit `main` already holds builds,
#   tests and packages every platform, then creates the draft release with
#   `SHA256SUMS`. Publishing it is a person's click: nothing here publishes.
# - A pull request that changes this workflow, `release/` or the CLI builds,
#   tests and packages the same way and uploads the archives as workflow
#   artifacts, a dry run with no release.
# - "Run workflow" does the dry run on any branch.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release/**
      - crates/cli/**
      - packages/desktop/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # The workspace version every crate inherits is the one release names.
      - name: Read the Cargo workspace version
        id: read
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::No version in Cargo.toml's [workspace.package]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A tag must name that version and sit on `main`, whose commits CI has
      # already passed; anything else is refused before a build starts.
      - name: Hold the tag to the version and to main
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.read.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not name the Cargo version $VERSION (expected v$VERSION)"
            exit 1
          fi
          case "$VERSION" in
            *-preview.*) ;;
            *)
              echo "::error::$VERSION is not a preview version; a release is a new ADR (ADR 0166)"
              exit 1
              ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, so it runs on any distribution; the tests run natively.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      NEXTEST_VERSION: 0.9.152
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The toolchain the tests run on; release/build.sh adds the target.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install musl
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.target }}-nextest-${{ env.NEXTEST_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-nextest-${{ env.NEXTEST_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install cargo-nextest
        run: command -v cargo-nextest || cargo install cargo-nextest --locked --version "$NEXTEST_VERSION"
      # The crates the binary is made of, on the platform it is built for. On
      # macOS this is the only run of their tests.
      - name: Test the CLI and the crates it is built from
        run: cargo nextest run --locked --no-fail-fast -p intake -p host -p infinity-cube
      # The one build entry point, the script `pnpm release:build` runs on a
      # person's own machine: it builds the browser application and the
      # release binary embedding it, smoke-tests the binary, and packs the
      # archive with a README naming its own version.
      - name: Build, smoke-test and pack the release archive
        id: pack
        run: |
          sh release/build.sh --target "$TARGET" --out "$RUNNER_TEMP/archive"
          echo "archive=$RUNNER_TEMP/archive/infinity-cube-$VERSION-$TARGET.tar.gz" >> "$GITHUB_OUTPUT"
        env:
          INFINITY_CUBE_COMMIT: ${{ github.sha }}
      # The install script, run as a person runs it but reading this archive
      # and the SHA256SUMS release/build.sh wrote beside it from disk: it installs and runs the binary, replaces it on a second
      # run, and installs nothing from an archive SHA256SUMS does not match.
      - name: Install the archive with the install script
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          export INFINITY_CUBE_DOWNLOAD_URL="file://$RUNNER_TEMP/archive"
          export INFINITY_CUBE_VERSION="v$VERSION"
          export INFINITY_CUBE_INSTALL_DIR="$RUNNER_TEMP/installed"
          sh release/install.sh
          sh release/install.sh
          shown="$("$INFINITY_CUBE_INSTALL_DIR/infinity-cube" --version)"
          case "$shown" in
            "infinity-cube $VERSION ("*) ;;
            *) echo "::error::the installed binary printed '$shown'"; exit 1 ;;
          esac
          mismatched="$RUNNER_TEMP/mismatched"
          mkdir -p "$mismatched"
          cp "$ARCHIVE" "$mismatched/"
          printf '%064d  %s\n' 0 "$(basename "$ARCHIVE")" > "$mismatched/SHA256SUMS"
          if INFINITY_CUBE_DOWNLOAD_URL="file://$mismatched" INFINITY_CUBE_INSTALL_DIR="$RUNNER_TEMP/refused" sh release/install.sh 2> "$RUNNER_TEMP/refused.err"; then
            echo "::error::the install script installed an archive SHA256SUMS does not match"
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.err"
          if ! grep -q 'does not match SHA256SUMS' "$RUNNER_TEMP/refused.err"; then
            echo "::error::the install script failed, but not because the archive did not match SHA256SUMS"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/refused/infinity-cube" ]; then
            echo "::error::the install script left a binary behind after refusing"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infinity-cube-${{ matrix.target }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          # The `release` job reads it in this same run and attaches it to the
          # draft release, so it only has to outlive the run, with room to
          # re-run a failed job or download a dry run's build.
          retention-days: 3

  # The same entry point with --desktop: it builds the bundle, installs the
  # disk image it made, opens a Space with it, and captures the screen.
  desktop:
    name: Build the desktop application
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-desktop-${{ env.TARGET }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-desktop-${{ env.TARGET }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build, install, open and pack the desktop application
        run: sh release/build.sh --desktop --target "$TARGET" --out "$RUNNER_TEMP/desktop"
        env:
          INFINITY_CUBE_SCREENSHOT: ${{ runner.temp }}/desktop-screenshot.png
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # A dry run may go without the updater's key; a release may not, since
      # an installed build would then never hear of the next one.
      - name: Require the signed update on a tag
        if: github.ref_type == 'tag'
        run: |
          if [ ! -e "$RUNNER_TEMP/desktop/latest.json" ]; then
            echo "::error::No signed update was made: set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ env.TARGET }}
          path: |
            ${{ runner.temp }}/desktop/InfinityCube-*
            ${{ runner.temp }}/desktop/latest.json
          if-no-files-found: error
          # As the CLI archives above: the `release` job reads it in this run.
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-screenshot
          path: ${{ runner.temp }}/desktop-screenshot.png
          if-no-files-found: error
          retention-days: 3

  install-script:
    name: Check the install script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # ShellCheck comes with the runner image. The script is POSIX sh, so it
      # runs under dash, which is Ubuntu's sh, as well as macOS's.
      - name: ShellCheck the install and build scripts
        run: shellcheck --shell=sh release/install.sh release/build.sh

  release:
    name: Create the draft release
    if: github.ref_type == 'tag'
    needs: [version, build, desktop, install-script]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that writes: it creates a draft, which a person publishes.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: infinity-cube-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-aarch64-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.dmg | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft pre-release
        run: |
          cat > notes.md <<EOF
          **Preview build** of InfinityCube $VERSION. It makes no compatibility promise: a directory it writes may not open in a later preview build, so keep your directory in git and read it with the build that wrote it (ADR 0166).

          Install it on macOS or Linux with:

          \`\`\`sh
          curl -fsSL https://github.com/$GH_REPO/releases/download/$TAG/install.sh | INFINITY_CUBE_VERSION=$TAG sh
          \`\`\`

          It checks the archive against \`SHA256SUMS\` and puts \`infinity-cube\` in \`~/.local/bin\`. Then run \`infinity-cube init my-space\`, then \`infinity-cube run my-space\`.

          Or download the archive for your platform, unpack it and follow its README. On macOS, run \`xattr -d com.apple.quarantine infinity-cube\` once first, because the build is not signed; the install script needs no such step.

          ### The desktop application (macOS, Apple silicon)

          Download \`InfinityCube-$VERSION-aarch64-apple-darwin.dmg\`, open it and drag InfinityCube to Applications. It is not signed with an Apple Developer ID, so the first time you open it macOS refuses: open **System Settings → Privacy & Security**, choose **Open Anyway** beside the message about InfinityCube, and confirm. Or run \`xattr -dr com.apple.quarantine /Applications/InfinityCube.app\` once. After that it opens as any application does, and it offers each newer preview build when one is published.
          EOF
          gh release create "$TAG" dist/*.tar.gz dist/*.dmg dist/*.sig dist/latest.json dist/SHA256SUMS release/install.sh \
            --draft --prerelease --verify-tag \
            --title "InfinityCube $VERSION (preview)" \
            --notes-file notes.md
