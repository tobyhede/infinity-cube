[package]
name = "host"
description = "The InfinityCube host: serves an Aggregate directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
intake = { path = "../intake" }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
