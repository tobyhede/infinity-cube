[package]
name = "infinity-cube"
description = "The InfinityCube command line: run and check an Aggregate directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "infinity-cube"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = { workspace = true }
host = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server-graceful", "tokio"] }
intake = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "sqlite-bundled"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
url = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
