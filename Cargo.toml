[workspace]
resolver = "3"
members = [
    "crates/intake",
    "crates/host",
    "crates/http-conformance",
    "crates/cli",
    "packages/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-preview.1"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
host = { path = "crates/host" }
http-conformance = { path = "crates/http-conformance" }
intake = { path = "crates/intake" }
bytes = "1"
dotenvy = "0.15"
http = "1"
http-body-util = "0.1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
# Only what exists to print may: each such place allows it where it prints.
print_stdout = "deny"
print_stderr = "deny"
